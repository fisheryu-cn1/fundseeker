<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fundseeker 数据检索{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('search') }}">📊 Fundseeker</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'search' %}active{% endif %}"
               href="{{ url_for('search') }}">产品检索</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'holdings_browse' %}active{% endif %}"
               href="{{ url_for('holdings_browse') }}">持仓检索</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
               href="{{ url_for('dashboard') }}">数据概览</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'market_dashboard' %}active{% endif %}"
               href="{{ url_for('market_dashboard') }}">市场行情</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint in (
                 'similarity_index',
                 'similarity_run_detail',
                 'similarity_cluster_detail',
                 'similarity_product_view',
                 'similarity_compare') %}active{% endif %}"
               href="{{ url_for('similarity_index') }}">相似度分析</a>
          </li>
        </ul>
        <span class="navbar-text small text-light-emphasis">
          只读界面 · 数据来源 fundseeker 库
        </span>
      </div>
    </div>
  </nav>

  <main class="container-fluid pb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted small py-3 border-top">
    Fundseeker 只读检索界面 · 数据来源 PostgreSQL <code>fundseeker</code> 库
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
