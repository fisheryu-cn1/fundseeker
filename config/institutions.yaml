# 第三方公共数据源配置
sources:
  eastmoney:
    name: 天天基金网
    base_url: https://fundf10.eastmoney.com
    # 基金详情页面模板，{code} 替换为基金代码
    detail_page: https://fundf10.eastmoney.com/jbgk_{code}.html

# 全局采集策略
# Collector-specific tuning
cmbwm:
  # CMB distribution page uses signed APIs and Playwright interaction.
  # Limit series traversal to keep runtime reasonable for the pilot phase.
  max_series: 3
  wait_seconds: 3

global:
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  default_headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"
    Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
    Accept-Encoding: "gzip, deflate, br"
    Connection: "keep-alive"
  # 全局默认请求间隔（秒）
  default_min_delay: 5.0
  default_max_delay: 10.0
  # 是否遵守 robots.txt
  respect_robots_txt: true
  # 单任务最长运行时间（秒）
  max_runtime_seconds: 3600

